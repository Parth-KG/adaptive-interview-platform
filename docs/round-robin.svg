<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" width="1160" height="300" role="img" aria-label="Round-robin rotation: the panel is walked in order, an interviewer that has seen enough evidence is skipped, and after the last one the walk wraps back to the start." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7A92"/>
    </marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5A524"/>
    </marker>
    <style>
      .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nm  { font-size: 14px; font-weight: 700; fill: #F2F4F8; }
      .nmd { font-size: 14px; font-weight: 700; fill: #5A6478; }
      .st  { font-size: 11px; fill: #98A2B8; font-style: italic; }
      .sta { font-size: 11px; fill: #F5A524; font-style: italic; }
      .std { font-size: 11px; fill: #5A6478; font-style: italic; }
      .cap { font-size: 11.5px; font-style: italic; }
    </style>
  </defs>

  <rect width="1160" height="300" rx="10" fill="#0B0D13"/>

  <!-- wrap-around, above -->
  <polyline points="1030,96 1030,42 130,42 130,92" fill="none" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="t cap" x="580" y="34" text-anchor="middle" fill="#6E7A92">after the last one it wraps back to the start and goes round again</text>

  <!-- seats -->
  <rect x="10" y="96" width="240" height="76" rx="7" fill="#1D2333" stroke="#8B7FE8"/>
  <text class="t nm"  x="130" y="130" text-anchor="middle">Host</text>
  <text class="t st"  x="130" y="152" text-anchor="middle">opened the interview</text>

  <rect x="310" y="96" width="240" height="76" rx="7" fill="#161B26" stroke="#F5A524"/>
  <text class="t nm"  x="430" y="130" text-anchor="middle">Coding interviewer</text>
  <text class="t sta" x="430" y="152" text-anchor="middle">just answered</text>

  <rect x="610" y="96" width="240" height="76" rx="7" fill="#0F131C" stroke="#2C3448"/>
  <text class="t nmd" x="730" y="130" text-anchor="middle">System-design interviewer</text>
  <text class="t std" x="730" y="152" text-anchor="middle">seen enough — skipped</text>

  <rect x="910" y="96" width="240" height="76" rx="7" fill="#1D2333" stroke="#8B7FE8"/>
  <text class="t nm"  x="1030" y="130" text-anchor="middle">Behavioural interviewer</text>
  <text class="t st"  x="1030" y="152" text-anchor="middle">next up</text>

  <!-- order arrows -->
  <line x1="256" y1="134" x2="304" y2="134" stroke="#3E4759" stroke-width="2" marker-end="url(#g)"/>
  <line x1="556" y1="134" x2="604" y2="134" stroke="#3E4759" stroke-width="2" marker-end="url(#g)"/>
  <line x1="856" y1="134" x2="904" y2="134" stroke="#3E4759" stroke-width="2" marker-end="url(#g)"/>

  <!-- the skip -->
  <polyline points="430,176 430,222 1030,222 1030,178" fill="none" stroke="#F5A524" stroke-width="2" marker-end="url(#y)"/>
  <text class="t cap" x="730" y="248" text-anchor="middle" fill="#F5A524">this lap, the walk goes straight past the one that is finished</text>

  <text class="t cap" x="580" y="278" text-anchor="middle" fill="#98A2B8">a seat leaves the rotation once it has seen enough evidence, hit its question cap, or run out of questions</text>
</svg>
