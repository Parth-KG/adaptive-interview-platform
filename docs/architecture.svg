<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="System architecture: browser talks to Agora Conversational AI, which exchanges transcript and control with the FastAPI backend; the backend calls Groq for scoring and planning and Supabase for storage." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7A92"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5A524"/>
    </marker>
    <style>
      .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hdr { font-size: 15px; font-weight: 700; fill: #F2F4F8; }
      .lbl { font-size: 12.5px; fill: #F2F4F8; }
      .sub { font-size: 11px; fill: #98A2B8; }
      .arw { font-size: 10.5px; fill: #98A2B8; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1200" height="500" rx="10" fill="#0B0D13"/>

  <!-- Browser -->
  <rect x="28" y="172" width="196" height="132" rx="8" fill="#1D2333" stroke="#2C3448"/>
  <text class="t hdr" x="126" y="205" text-anchor="middle">Browser</text>
  <text class="t sub" x="126" y="228" text-anchor="middle">Next.js 16 · React 19</text>
  <text class="t sub" x="126" y="247" text-anchor="middle">Agora Web SDK</text>
  <text class="t sub" x="126" y="266" text-anchor="middle">Silero VAD</text>
  <text class="t sub" x="126" y="285" text-anchor="middle">Supabase JS</text>

  <!-- Agora -->
  <rect x="286" y="88" width="286" height="300" rx="8" fill="#161B26" stroke="#8B7FE8"/>
  <text class="t tag" x="308" y="116" fill="#8B7FE8">AGORA</text>
  <text class="t hdr" x="308" y="141">Conversational AI Engine</text>
  <rect x="308" y="158" width="242" height="52" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="t lbl" x="429" y="180" text-anchor="middle">Host + n specialist agents</text>
  <text class="t sub" x="429" y="198" text-anchor="middle">one voice persona each, one floor</text>
  <rect x="308" y="222" width="242" height="42" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="t lbl" x="429" y="248" text-anchor="middle">RTC — duplex audio</text>
  <rect x="308" y="276" width="242" height="42" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="t lbl" x="429" y="302" text-anchor="middle">ASR — speech to text</text>
  <rect x="308" y="330" width="242" height="42" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="t lbl" x="429" y="356" text-anchor="middle">RTM — transcript stream</text>

  <!-- Backend -->
  <rect x="634" y="88" width="292" height="300" rx="8" fill="#161B26" stroke="#F5A524"/>
  <text class="t tag" x="656" y="116" fill="#F5A524">FASTAPI BACKEND</text>
  <text class="t hdr" x="656" y="141">Python 3.12</text>
  <rect x="656" y="158" width="248" height="40" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="m lbl" x="780" y="183" text-anchor="middle">routes/sessions.py</text>
  <rect x="656" y="208" width="248" height="40" rx="6" fill="#1D2333" stroke="#8B7FE8"/>
  <text class="m lbl" x="780" y="227" text-anchor="middle">orchestrator/llm_host</text>
  <text class="t sub" x="780" y="242" text-anchor="middle">proposes one action</text>
  <rect x="656" y="258" width="248" height="40" rx="6" fill="#1D2333" stroke="#F5A524"/>
  <text class="t lbl" x="780" y="277" text-anchor="middle">deterministic validator</text>
  <text class="t sub" x="780" y="292" text-anchor="middle">commits it, or refuses</text>
  <rect x="656" y="308" width="120" height="64" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="m lbl" x="716" y="333" text-anchor="middle">scorer</text>
  <text class="t sub" x="716" y="351" text-anchor="middle">score +</text>
  <text class="t sub" x="716" y="365" text-anchor="middle">satisfaction</text>
  <rect x="784" y="308" width="120" height="64" rx="6" fill="#1D2333" stroke="#2C3448"/>
  <text class="m lbl" x="844" y="333" text-anchor="middle">SessionState</text>
  <text class="t sub" x="844" y="351" text-anchor="middle">in-process,</text>
  <text class="t sub" x="844" y="365" text-anchor="middle">one worker</text>

  <!-- Groq -->
  <rect x="978" y="112" width="196" height="110" rx="8" fill="#1D2333" stroke="#2C3448"/>
  <text class="t hdr" x="1076" y="141" text-anchor="middle">Groq</text>
  <text class="m sub" x="1076" y="166" text-anchor="middle">gpt-oss-120b</text>
  <text class="t sub" x="1076" y="182" text-anchor="middle">scoring · planning</text>
  <text class="m sub" x="1076" y="202" text-anchor="middle">gpt-oss-20b</text>

  <!-- Supabase -->
  <rect x="978" y="262" width="196" height="110" rx="8" fill="#1D2333" stroke="#2C3448"/>
  <text class="t hdr" x="1076" y="291" text-anchor="middle">Supabase</text>
  <text class="t sub" x="1076" y="314" text-anchor="middle">Postgres + RLS</text>
  <text class="t sub" x="1076" y="333" text-anchor="middle">panels · reports</text>
  <text class="t sub" x="1076" y="352" text-anchor="middle">banks · progression</text>

  <!-- Browser <-> Agora -->
  <line x1="228" y1="212" x2="282" y2="212" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="t arw" x="255" y="203" text-anchor="middle">mic</text>
  <line x1="282" y1="264" x2="228" y2="264" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="t arw" x="255" y="255" text-anchor="middle">voice</text>

  <!-- Agora <-> Backend -->
  <line x1="576" y1="178" x2="630" y2="178" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="t arw" x="603" y="169" text-anchor="middle">transcript</text>
  <line x1="630" y1="352" x2="576" y2="352" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="t arw" x="603" y="343" text-anchor="middle">speak</text>

  <!-- Backend -> Groq / Supabase -->
  <line x1="930" y1="167" x2="974" y2="167" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="930" y1="317" x2="974" y2="317" stroke="#6E7A92" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Browser -> Supabase, under everything -->
  <polyline points="126,308 126,452 1076,452 1076,376" fill="none" stroke="#6E7A92" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="t arw" x="601" y="443" text-anchor="middle">browser reads and writes its own rows directly, under row-level security</text>

  <!-- floor note -->
  <path d="M780,88 L780,64 L429,64 L429,84" fill="none" stroke="#F5A524" stroke-width="1.6" marker-end="url(#aw)"/>
  <text class="t arw" x="604" y="56" text-anchor="middle" fill="#F5A524">the backend owns the speaking floor — exactly one agent may talk at a time</text>
</svg>
